name: CI

# Runs syntax checks and the unittest suite on pushes and pull requests.
on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile sources
        run: python -m py_compile MetadataFromASIN/*.py run_asin.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
