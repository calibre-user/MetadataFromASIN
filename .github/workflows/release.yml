name: Release

# Publishes a Calibre-installable plugin ZIP to GitHub Releases.
#
# Trigger: push a semver tag, e.g. `v0.0.1`.
#   - Tags reachable from `main`    -> marked as the "latest" release.
#   - Tags reachable only from `develop` -> marked as a pre-release.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build plugin ZIP
        run: |
          cd MetadataFromASIN
          zip -r ../MetadataFromASIN.zip . -x '*__pycache__*' '*.pyc'

      - name: Determine release channel
        id: channel
        run: |
          git fetch origin main:refs/remotes/origin/main || true
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main 2>/dev/null; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" MetadataFromASIN.zip "${args[@]}"
